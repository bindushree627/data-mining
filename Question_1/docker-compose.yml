services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    environment:
      POSTGRES_DB: annapurna
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./masters.sql:/docker-entrypoint-initdb.d/01_masters.sql:ro

  minio:
    image: quay.io/minio/minio
    container_name: annapurna-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: